  <body class="bg-[#0B0D11] text-slate-100 antialiased selection:bg-[#FF6B00] selection:text-white overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module">
      if (import.meta.env.DEV && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(async (registrations) => {
          await Promise.all(registrations.map((registration) => registration.unregister()));
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(
              keys.filter((key) => key.startsWith('forgemuscle-cache-')).map((key) => caches.delete(key))
            );
          }
        }).catch(() => {});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
